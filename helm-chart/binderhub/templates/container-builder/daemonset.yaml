{{- if ne .Values.imageBuilderType "host" -}}
{{- $builderName := .Values.imageBuilderType -}}
{{- $builder := index .Values $builderName -}}
{{- $daemonset := $builder.daemonset -}}
{{- $hostSocketPath := printf "%s/%s" $builder.hostSocketDir $builder.hostSocketName }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-{{ $builderName }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      name:  {{ .Release.Name }}-{{ $builderName }}
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}-{{ $builderName }}
        app: binder
        component: image-builder
        release: {{ .Release.Name }}
        heritage: {{ .Release.Service }}
      annotations:
        checksum/start-script: {{ include (print $.Template.BasePath "/container-builder/configmap.yaml") . | sha256sum }}
    spec:
      {{- with include "jupyterhub.imagePullSecrets" (dict "root" . "image" $daemonset.image) }}
      imagePullSecrets: {{ . }}
      {{- end }}
      tolerations:
      - effect: NoSchedule
        key: hub.jupyter.org/dedicated
        operator: Equal
        value: user
      - effect: NoSchedule
        key: hub.jupyter.org_dedicated
        operator: Equal
        value: user
      {{- with .Values.tolerations }}
      {{- . | toYaml | nindent 6 }}
      {{- end }}
      nodeSelector: {{ .Values.config.BinderHub.build_node_selector | toJson }}

      {{- with $builder.initContainers }}
      initContainers:
        {{- . | toYaml | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ $builderName }}
          image: {{ $daemonset.image.name }}:{{ $daemonset.image.tag }}
          {{- with $daemonset.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with $builder.resources }}
          resources:
            {{- $builder.resources | toYaml | nindent 12 }}
          {{- end }}
          args:
            - /start.sh

          {{- if eq $builderName "dind" }}
          securityContext:
            privileged: true
          volumeMounts:
          - name: dockerlib-dind
            mountPath: /var/lib/docker
          - name: run-dind
            mountPath: {{ $builder.hostSocketDir }}
          {{- end }}
          {{- if eq $builderName "pink" }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
          - name: podman-containers
            mountPath: /var/lib/containers/storage
          - name: run-pink
            mountPath: {{ $builder.hostSocketDir }}
          {{- end }}
          - name: start-script
            mountPath: /start.sh
            subPath: start.sh

          {{- with $daemonset.extraVolumeMounts }}
          {{- . | toYaml | nindent 10 }}
          {{- end }}

          {{- with $daemonset.lifecycle }}
          lifecycle:
            {{- . | toYaml | nindent 12 }}
          {{- end }}

      volumes:
        - name: start-script
          configMap:
            name: builder-start-script
            defaultMode: 0755
        {{- if eq $builderName "dind" }}
        - name: dockerlib-dind
          hostPath:
            path: {{ $builder.hostLibDir }}
            type: DirectoryOrCreate
        - name: run-dind
          hostPath:
            path: {{ $builder.hostSocketDir }}
            type: DirectoryOrCreate
        {{- with $daemonset.extraVolumes }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if eq $builderName "pink" }}
        - name: podman-containers
          hostPath:
            path: {{ $builder.hostStorageDir }}
            type: DirectoryOrCreate
        - name: run-pink
          hostPath:
            path: {{ $builder.hostSocketDir }}
            type: DirectoryOrCreate
        {{- with $daemonset.extraVolumes }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
        {{- end }}

      terminationGracePeriodSeconds: 30
{{- end }}
